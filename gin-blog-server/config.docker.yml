Server:
  Mode: release # debug | release
  Port: :8765
  DbType: "mysql" # mysql | sqlite
  DbAutoMigrate: true # Auto-migrate DB schema (skip if unchanged to speed startup)
  DbLogMode: "error" # GORM 日志级别 silent, error, warn, info, 默认 info
  # 只有来自这些网段的请求才采信 X-Real-IP / X-Forwarded-For, 留空默认只信任内网
  # (compose 里 nginx 和后端在同一 docker 网络, 内网兜底就够)
  trusted-proxies: []
  # 允许跨域的前端来源, 如 ["https://blog.example.com"], 留空只放行本机与内网
  # compose 部署下前端和 /api 同源, 不需要跨域
  allowed-origins: []
JWT:
  Secret: "abc123321"
  Expire: 24 # hour
  Issuer: "gin-vue-blog"
Mysql:
  Host: "127.0.0.1"
  Port: "3306"
  Config: "charset=utf8mb4&parseTime=True&loc=Local" # Extra options, e.g., timezone
  Dbname: "gvb"
  Username: "root"
  Password: "123456"
Sqlite:
  Dsn: "gvb.db"
Redis:
  DB: 7
  Addr: '127.0.0.1:6379'
  Password: ''
Session:
  Name: "mysession"
  Salt: "salt"
  MaxAge: 600 # second
  Secure: false # 部署在 https 之后时置 true, session cookie 只走加密连接
Log:
  Level: "error" # debug | info | warn | error
  Format: "text" # text | json
  Directory: "log"
Email:
  Host: "smtp.163.com" # SMTP server host (e.g., smtp.qq.com)
  Port: 465 # SMTP port (commonly 465)
  From: "" # Sender email address
  # 下面两个键名必须和 g.Config.Email 对齐, 原来写的 Secret / Nickname 不会被绑定上
  SmtpPass: "" # 密钥, 不是邮箱登录密码, 是开启 smtp 服务后获取的一串验证码
  SmtpUser: "" # 发件人昵称, 通常为自己的邮箱名
Captcha:
  # false: 注册直接创建用户, 不发邮件, 也不需要配上面的 Email 段
  # true: 注册只发验证邮件, 用户点击链接后才真正创建, 必须先把 Email 段配全
  SendEmail: false
  ExpireTime: 15  # 验证链接过期时间 (分钟)
Upload:
  OssType: "local" # local | qiniu
  Path: "public/uploaded"      # Public URL path (effective when OssType="local")
  StorePath: "public/uploaded" # Local upload dir (effective when OssType="local")
Qiniu:
  ImgPath: "" # Public image base URL
  Zone: ""
  Bucket: ""
  AccessKey: ""
  SecretKey: ""
  UseHttps: false
  UseCdnDomains: false