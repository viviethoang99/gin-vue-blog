version: "3"

networks:
  gvb-network:
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET}

services:
  gvb-redis:
    image: redis:7.0-alpine
    container_name: gvb-redis
    restart: always
    volumes:
      - ${DATA_DIRECTORY}/data/redis/:/data
    ports:
      - ${REDIS_PORT}:6379 # Host-exposed port; Redis inside container always 6379
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    networks:
      gvb-network:
        ipv4_address: ${REDIS_HOST}

  gvb-mysql:
    build: ../build/mysql
    container_name: gvb-mysql
    restart: always
    volumes:
      - ${DATA_DIRECTORY}/data/mysql:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - TZ=Asia/Shanghai
    ports:
      - ${MYSQL_PORT}:3306 # Host-exposed port; MySQL inside container always 3306
    networks:
      gvb-network:
        ipv4_address: ${MYSQL_HOST}

  gvb-server:
    build: ../../gin-blog-server
    container_name: gvb-server
    restart: always
    # Backend depends on MySQL and Redis
    depends_on:
      gvb-redis:
        condition: service_started
      gvb-mysql:
        condition: service_started
    volumes:
      - ${DATA_DIRECTORY}/file/uploaded:/gvb/public/uploaded
    environment:
      # These env vars override settings in backend config.docker.yml
      - TZ=Asia/Shanghai
      # SERVER
      - SERVER_PORT=:${SERVER_PORT} # Service port
      # MySQL
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=3306
      - MYSQL_DBNAME=gvb # Default gvb; changing requires altering gvb-mysql image
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
      # Redis
      - REDIS_ADDR=${REDIS_HOST}:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - ${SERVER_PORT}:${SERVER_PORT}
    networks:
      gvb-network:
        ipv4_address: ${BACKEND_HOST}

  gvb-web:
    # Build behavior depends on env and selected Dockerfile
    build: ${WEB_BUILD_CONTEXT}
    container_name: gvb-web
    restart: always
    # To enable HTTPS, provide cert files and set USE_HTTPS=true
    volumes:
      - ./server.crt:/etc/nginx/crt/server.crt
      - ./server.key:/etc/nginx/crt/server.key
    environment:
      - USE_HTTPS=${USE_HTTPS} # Set true to use HTTPS
      - SERVER_NAME=${SERVER_NAME} # Domain or localhost
      - BACKEND_HOST=${BACKEND_HOST} # Backend service address
      - SERVER_PORT=${SERVER_PORT} # Service port
    ports:
      - "80:80"
      - "443:443"
    networks:
      gvb-network:
        ipv4_address: ${FRONTEND_HOST}
