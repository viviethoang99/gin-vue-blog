name: irohasu_jaspr
description: A new Jaspr project
version: 0.0.1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
     sdk: flutter
  jaspr: ^0.23.5
  jaspr_flutter_embed: ^0.4.11
  jaspr_router: ^0.9.0
  dio: ^5.11.1
  json_annotation: ^4.12.0
  markdown: ^7.3.1
  pretty_dio_logger: ^1.4.0
  retrofit: ^4.10.0
  universal_web: ^1.1.1+1

dev_dependencies:
  build_runner: ^2.10.0
  # Newer 4.8.x releases require analyzer 13+, while jaspr_builder 0.23.5
  # currently requires analyzer 12.x.
  build_web_compilers: 4.8.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  jaspr_builder: ^0.23.5
  json_serializable: ^6.14.1
  # retrofit_generator 10.2.10+ also requires analyzer 13+.
  retrofit_generator: 10.2.9

jaspr:
  # The blog content is managed by Gin, so render each request on the server
  # instead of freezing the current article list into a static build.
  mode: server
  flutter: none

flutter:
  uses-material-design: true
